name: CI

# 两个作业，性质完全不同，所以分开：
#
#   privacy-gate  拦"凭证/第三方素材/超大文件进仓库"。确定性行为，本地已验证
#                 PASS，所以它是**拦合并**的。
#   tests         跑 tests/ 下的 pytest 套件。当前**不拦合并**，原因见文末
#                 「为什么 tests 作业还不拦合并」——拦了也只会变成一道人人无视
#                 的红灯。
# 只有 pull_request 和 master 的 push 会触发：给协作者的分支跑检查，同时避免
# 在每条 fix/* 分支上重复烧额度（公开仓库的 Actions 分钟数免费且不限量，但排队
# 和噪音仍然要省）。

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# 最小权限：这两个作业都只需要读代码。没有这一步，GITHUB_TOKEN 默认带的写权限
# 会让一个被改过的 workflow 文件有机会推送回仓库。
permissions:
  contents: read

# 同一分支连着推几次时，取消还没跑完的旧运行，只留最新一次。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-gate:
    name: privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # privacy_gate.py 只读工作区文件（git ls-files / git diff --cached /
        # git cat-file HEAD:<file>），不需要完整历史，所以浅克隆就够。

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
        # 与 mise.toml / PyInstaller 打包用的解释器保持同一个大版本。

      - name: 扫描凭证、第三方素材与超大文件
        run: python weread/privacy_gate.py
        # 不加 --strict：--strict 会把测试里刻意埋的假凭证（wrk-fake-… 之类）
        # 也算作拦截项，那正是本地 pre-push 钩子省略它的原因。发布前要更严的话，
        # 在这里改成 `python weread/privacy_gate.py --strict`。

  tests:
    name: tests (Windows / Python 3.9)
    # 必须用 Windows：被测代码依赖 DPAPI、icacls、单实例互斥体和
    # CREATE_NO_WINDOW，这些在 Linux 运行器上不存在。
    runs-on: windows-latest
    timeout-minutes: 15
    # 拦合并。master 近 8 次 CI 连续 success（438 passed / 0 failed，约 2 分钟），
    # 失败子集的定性见文末注释。本机跑全量时有 3 个 stall 计时用例偶发失败，
    # 是测试方法（真时 sleep + perf_counter）对机器负载敏感，不是代码缺陷——
    # 这正是门要设在 CI 而不是开发者本机的原因。
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
        # 依赖清单与版本单一来源是仓库根的 requirements-dev.txt：这里的行内
        # 清单曾是从 import 反推的，版本不锁时上游一个发版就能让 CI 无故变红/
        # 变绿。版本实测可用后才写进该文件（见文件内注释）。

      - name: 跑测试
        run: python -m pytest -q -m "not local_corpus"
        # 真实导出语料验收在有本机语料的环境单独运行：pytest -m local_corpus。
        # 收集规则来自仓库根目录的 pytest.ini。那里的 python_functions = test_*
        # 不是可有可无的：测试文件用名为 `test` 的装饰器自我登记，pytest 默认
        # 规则 `test*` 会把这个装饰器本身也当用例收集，然后在三十来个文件里各报
        # 一个 "fixture 'fn' not found"。

# ---------------------------------------------------------------------------
# tests 作业的状态记录（拦合并前后的定性结论）
#
# 原先的硬阻塞——套件跑到一半被自己发出的 Ctrl+C 打断——已修掉：
#
#   weread_desktop.py 的 process_is_alive() 以前在 Windows 上用 os.kill(pid, 0)
#   判断进程存活。signal.CTRL_C_EVENT 的整数值是 0，所以 CPython 在 Windows 上把
#   这次调用转成 GenerateConsoleCtrlEvent(CTRL_C_EVENT, pid)，即往该进程组发一个
#   真的 Ctrl+C。导出锁（export.lock）记录的是上一个导出进程的 pid，当那个 pid 与
#   运行器自己的控制台进程组重合时，检查锁 = 把 Ctrl+C 打给自己，pytest 抛
#   KeyboardInterrupt 中止整个运行。现在 Windows 分支改为
#   OpenProcess(SYNCHRONIZE) + WaitForSingleObject(0)，与同文件
#   process_started_at() 的 ctypes 写法一致；tests/test_disk_edge_cases.py
#   里有断言守着"Windows 探针不再出现 os.kill"。
#
# 拦合并时（2026-10-19）的实际状态：master 近 8 次 CI 连续 success，
# tests 438 passed / 0 failed，约 2 分钟。已去掉 continue-on-error，并把它
# 与 privacy-gate 一起加进 protect-master 的 required status checks。
#
# 仍存在的两类已知非代码问题（都不阻塞合入门，记录在此避免重复定性）：
#
#   1. 本机偶发 3 个 stall 计时用例失败（test_desktop_paging /
#      test_desktop_resume / test_desktop_stall_modal）。这些用例用真时
#      sleep + perf_counter 计时，开发者机器负载高时窗口构建/对话框轮询
#      超过 stall 阈值就被误判。CI 运行器资源独占、约 2 分钟跑完，复现不了。
#      这是测试方法对负载敏感，不是代码缺陷——修法是将来把计时改为可注入
#      时钟，不是放宽断言。
#   2. 外部插件目录缺席的用例由 tests/conftest.py 带原因跳过（读的是仓库外
#      的 Kindle 插件树，缺席是"这台机器没有该目录"，不是"代码坏了"）。
#
# ---------------------------------------------------------------------------
# 关于依赖版本
#
# 已改为锁版本安装：单一事实源是仓库根的 requirements-dev.txt，tests 作业
# pip install -r 它。这个项目发布的是 PyInstaller 冻结的 exe，锁版本让依赖
# 漂移先在打包结果上暴露，而不是让 CI 莫名变红或变绿。测试发现某依赖的新版本
# 真的破坏功能时，再单独提 PR 升版本并说明原因。
