name: CI

# 两个作业，性质完全不同，所以分开：
#
#   privacy-gate  拦"凭证/第三方素材/超大文件进仓库"。确定性行为，本地已验证
#                 PASS，所以它是**拦合并**的。
#   tests         跑 tests/ 下的 pytest 套件。当前**不拦合并**，原因见文末
#                 「为什么 tests 作业还不拦合并」——拦了也只会变成一道人人无视
#                 的红灯。
# 只有 pull_request 和 master 的 push 会触发：给协作者的分支跑检查，同时避免
# 在每条 fix/* 分支上重复烧额度（公开仓库的 Actions 分钟数免费且不限量，但排队
# 和噪音仍然要省）。

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

# 最小权限：这两个作业都只需要读代码。没有这一步，GITHUB_TOKEN 默认带的写权限
# 会让一个被改过的 workflow 文件有机会推送回仓库。
permissions:
  contents: read

# 同一分支连着推几次时，取消还没跑完的旧运行，只留最新一次。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy-gate:
    name: privacy gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # privacy_gate.py 只读工作区文件（git ls-files / git diff --cached /
        # git cat-file HEAD:<file>），不需要完整历史，所以浅克隆就够。

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
        # 与 mise.toml / PyInstaller 打包用的解释器保持同一个大版本。

      - name: 扫描凭证、第三方素材与超大文件
        run: python weread/privacy_gate.py
        # 不加 --strict：--strict 会把测试里刻意埋的假凭证（wrk-fake-… 之类）
        # 也算作拦截项，那正是本地 pre-push 钩子省略它的原因。发布前要更严的话，
        # 在这里改成 `python weread/privacy_gate.py --strict`。

  tests:
    name: tests (Windows / Python 3.9)
    # 必须用 Windows：被测代码依赖 DPAPI、icacls、单实例互斥体和
    # CREATE_NO_WINDOW，这些在 Linux 运行器上不存在。
    runs-on: windows-latest
    timeout-minutes: 15
    # 暂不拦合并。见文末「为什么 tests 作业还不拦合并」——拦了也只会变成一道人人无视
    # 的红灯。
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          python -m pip install lupa lxml requests customtkinter darkdetect pillow qrcode pytest
        # 仓库目前没有任何依赖声明文件（无 requirements.txt / pyproject.toml），
        # 这份清单是从 import 反推的。版本故意不锁：先看清干净环境能不能装上，
        # 锁版本是要单独决定的事（见下）。

      - name: 跑测试
        run: python -m pytest -q
        # 收集规则来自仓库根目录的 pytest.ini。那里的 python_functions = test_*
        # 不是可有可无的：测试文件用名为 `test` 的装饰器自我登记，pytest 默认
        # 规则 `test*` 会把这个装饰器本身也当用例收集，然后在三十来个文件里各报
        # 一个 "fixture 'fn' not found"。

# ---------------------------------------------------------------------------
# 为什么 tests 作业还不拦合并（做完下面这些再打开）
#
# 原先的硬阻塞——套件跑到一半被自己发出的 Ctrl+C 打断——已经修掉了：
#
#   weread_desktop.py 的 process_is_alive() 以前在 Windows 上用 os.kill(pid, 0)
#   判断进程存活。signal.CTRL_C_EVENT 的整数值是 0，所以 CPython 在 Windows 上把
#   这次调用转成 GenerateConsoleCtrlEvent(CTRL_C_EVENT, pid)，即往该进程组发一个
#   真的 Ctrl+C。导出锁（export.lock）记录的是上一个导出进程的 pid，当那个 pid 与
#   运行器自己的控制台进程组重合时，检查锁 = 把 Ctrl+C 打给自己，pytest 抛
#   KeyboardInterrupt 中止整个运行（两次独立复现，各只跑完 188/401 个用例）。
#   现在 Windows 分支改为 OpenProcess(SYNCHRONIZE) + WaitForSingleObject(0)，
#   与同文件 process_started_at() 的 ctypes 写法一致；tests/test_disk_edge_cases.py
#   里有断言守着"Windows 探针不再出现 os.kill"。
#
# 剩下的是**运行器环境**问题，都与代码无关，但需要逐个定性后才好决定处置：
#
#   1. DPAPI 相关 3 个（test_desktop_secrets.py）
#      CryptProtectData / CryptUnprotectData 在托管运行器上不能往返（KeyError:
#      'cookies'）。这类用例本质上是"只有真实 Windows 用户会话里才成立"的契约。
#   2. Tk 建不了窗口 7 个（test_desktop_logout.py 等）
#      运行器上 _tkinter.TclError: invalid command name "tcl_findLibrary"。
#      本机偶发同一条错误，说明是 Tk 初始化环境，不是被测代码。
#   3. DPI / 字体差异 2 个（test_desktop_combo 焦点、test_desktop_layout 行数）
#      断言写死了像素与焦点目标，字体度量一变就倒。
#   4. 外部插件目录（test_desktop_bundle.py / test_desktop_bundle_lua.py）
#      已在代码里改成 allow_module_level 跳过：那两处读的是仓库外的 Kindle 插件树，
#      缺席是"这台机器没有该目录"，不是"代码坏了"。
#   5. 用例间互相干扰：同一批用例单独跑通过、连在一起跑失败，失败项每次还不同
#      （本机全量与单独跑的失败集不同，同一文件三次跑同一项也时过时不过）。
#
# 修干净之后再：去掉 continue-on-error，把它加进 protect-master 规则集的
# required status checks，这道门才算真关上。
#
# 附：本次已修好、不再需要处理的部分 —— 插件缺席的用例现在由 tests/conftest.py
# 带原因跳过（本机有插件时 0 skipped，没有把测试静音）；原先 15 个文件在收集阶段
# 直接崩的情况已消除。
#
# ---------------------------------------------------------------------------
# 关于依赖版本
#
# 现在不锁版本安装。这个项目发布的是 PyInstaller 冻结的 exe，依赖漂移会先在打包
# 结果上表现出来；所以合理做法是补一个 requirements-dev.txt 把版本钉死（本地实测
# 可用的一组见下），再让这里 pip install -r 它。
#
#   lupa 2.8 · lxml 6.1.0 · requests 2.32.5 · customtkinter 5.2.2
#   darkdetect 0.8.0 · pillow 11.3.0 · qrcode 8.2 · pytest 8.4.2
