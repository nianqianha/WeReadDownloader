[pytest]
# The test files register themselves through a decorator named `test`:
#
#     ALL_TESTS = []
#     def test(fn):
#         ALL_TESTS.append(fn)
#         return fn
#
# pytest's default collection pattern is `test*`, which also matches that bare
# helper, so it was collected as a test case and then failed with
# "fixture 'fn' not found" -- one phantom error in thirty-odd files. Requiring
# the underscore limits collection to the real cases (`test_*`), which is what
# every file names them.
python_functions = test_*
testpaths = tests
markers =
    local_corpus: acceptance replay requiring an existing local book export
# Windows Tcl file channels can fail when fd capture replaces OS descriptors.
# capture=sys keeps Python-level capture (assertion rewriting still works) while
# leaving the OS descriptors alone, which is what Tcl needs to read init.tcl.
addopts = --capture=sys
